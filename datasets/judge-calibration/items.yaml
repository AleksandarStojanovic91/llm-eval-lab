# Judge calibration set: responses with independent pass/fail labels per judge criterion.
# `npm run eval:calibrate-judge` runs the judge on each item and reports agreement (accuracy, Cohen's kappa).
#
# Labelling status: DRAFT. These labels were written by the project author while building the harness, from the
# rubric in src/eval/judge.ts, without looking at any judge output. They still need an independent review by a
# second person before the agreement number can be trusted (docs/eval-design.md, "Judge calibration").
#
# Tool calls are executed against the fixture backend, so the judge sees real tool results.
# Items tagged known-negative are the eval-audit probes: an empty answer, "I don't know", and a confident
# answer to a different question. The judge must fail all three overall.
labelled_by: project author (draft, needs second-rater review)
items:
  - id: cal-001
    user: Is Clean Code available?
    tool_calls: [{ name: search_books, input: { q: Clean Code } }]
    reference_answer: Yes, one of the two copies of *Clean Code* is available.
    response: Yes, one of the two copies of *Clean Code* is available, so you can borrow it today.
    labels: { correctness: pass, groundedness: pass, helpfulness: pass, tone: pass }

