version: 2

# Minor and patch updates are grouped into one PR per ecosystem; majors arrive one by one.
# An @anthropic-ai/sdk update can change request shapes: re-run `npm run cassettes:synthesize` and the unit tests,
# and re-record live cassettes before trusting a comparison across the upgrade.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']
